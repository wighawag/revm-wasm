name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  # Standard changesets flow: open (or update) a version PR while changesets are
  # pending, and publish once that PR merges.
  #
  # NOTE: no Rust anywhere in this job, on purpose. The `.wasm` is committed
  # (ADR 0003), so `prepublishOnly` is format:check + build + test and cannot
  # fail for a toolchain reason. If the artifact is ever built at release
  # instead, the pinned toolchain from `ci.yml`'s wasm-rebuild job moves here,
  # and `prepublishOnly` must still NOT depend on it.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile

      # The artifact is the product, so it is checked before anything is
      # published, not after.
      - run: pnpm build
      - run: pnpm test

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
